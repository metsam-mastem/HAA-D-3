[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haa-d3"
version = "0.1.0"
description = "Portable scientific-to-cinematic research and scene contracts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HAA-D-3 contributors" }]
dependencies = ["jsonschema>=4.20,<5"]\n\n[project.optional-dependencies]\nmedia = ["CairoSVG>=2.7,<3"]

[tool.setuptools.data-files]
"share/haa-d3/schemas" = ["schemas/*.json"]

[project.scripts]
haa-d3 = "haa_d3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
