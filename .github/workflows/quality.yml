name: HAA-D-3 Quality
on:
  push:
    branches: [main, "work/**", "feat/**", "fix/**", "docs/**", "research/**", "creative/**"]
  pull_request:
permissions:
  contents: read
jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate example SceneSpec
        run: PYTHONPATH=src python -m haa_d3.cli validate-scene examples/scenes/synthetic-emergence.scene.json
