name: HAA-D-3 Quality Gate
on:
  push:
    branches: [main, "work/**", "feat/**", "fix/**", "docs/**", "research/**", "creative/**", "foundation/**", "release/**", "phase-c/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Choose the smallest validation scope needed"
        required: true
        default: full
        type: choice
        options:
          - full
          - docs
          - python
permissions:
  contents: read
jobs:
  repository-governance:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Enforce single-source repository structure
        run: python scripts/check_repository_structure.py
      - name: Check tracked Markdown inventory
        run: python scripts/check_document_catalog.py
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
  python-core:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install patched build tooling
        run: python -m pip install --upgrade "setuptools>=84.1.0"
      - name: Install package and media dependencies
        run: python -m pip install -e ".[media]"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable
          pip-audit --skip-editable --format cyclonedx-json --output /tmp/haa-d3-sbom.json
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: haa-d3-python-sbom
          path: /tmp/haa-d3-sbom.json
          retention-days: 30
      - name: Run complete Python test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate example SceneSpec
        run: PYTHONPATH=src python -m haa_d3.cli validate-scene examples/scenes/synthetic-emergence.scene.json
      - name: Generate and validate Kuramoto SceneSpec
        run: |
          PYTHONPATH=src python -m haa_d3.cli kuramoto-scene --nodes 12 --steps 5 --seed 11 --output /tmp/kuramoto-scene.json
          PYTHONPATH=src python -m haa_d3.cli validate-scene /tmp/kuramoto-scene.json
      - name: Build end-to-end release bundle
        run: |
          PYTHONPATH=src python -m haa_d3.cli build-release --nodes 8 --steps 4 --dt 0.1 --frame-rate 5 --video --output /tmp/haa-d3-release.zip
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/haa-d3-release.zip'); assert 'manifest.json' in z.namelist(); assert 'frames/000000.svg' in z.namelist(); assert 'sonification/coherence.mid' in z.namelist(); assert 'sonification/coherence.wav' in z.namelist(); assert 'video/preview.mp4' in z.namelist()"
      - name: Upload generated vertical-slice release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: haa-d3-e2e-release
          path: /tmp/haa-d3-release.zip
          retention-days: 14
      - name: Generate knowledge graph, SVG and provenance receipt
        run: PYTHONPATH=src python -m haa_d3.cli render-knowledge-graph examples/knowledge/seed-graph.json --out /tmp/knowledge-graph
      - name: Verify generated graph artifacts
        run: |
          test -s /tmp/knowledge-graph/graph.json
          test -s /tmp/knowledge-graph/graph.svg
          test -s /tmp/knowledge-graph/receipt.json

  blender-runtime:
    needs: python-core
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb xauth libgl1-mesa-dri ffmpeg
          blender --version
      - name: Install HAA-D-3 core
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
          python -m pip install -e .
      - name: Generate representative SceneSpec
        run: |
          PYTHONPATH=src python -m haa_d3.cli kuramoto-scene --nodes 8 --steps 10 --dt 0.1 --frame-rate 10 --seed 17 --output /tmp/haa-d3-blender-scene.json
      - name: Generate deterministic WAV data sonification
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from haa_d3.kuramoto import simulate_kuramoto
          from haa_d3.media import write_sonification_wav
          simulation = simulate_kuramoto(nodes=8, coupling=1.5, dt=0.1, steps=10, seed=17)
          write_sonification_wav(simulation, Path("/tmp/haa-d3-blender/coherence.wav"))
          PY
      - name: Execute Blender background render
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --factory-startup --python adapters/blender/render_scene.py -- --scene /tmp/haa-d3-blender-scene.json --output /tmp/haa-d3-blender
      - name: Assemble and decode Blender audiovisual preview
        run: |
          ffmpeg -y -hide_banner -loglevel error -framerate 10 -start_number 1 -i /tmp/haa-d3-blender/frame_%04d.png -i /tmp/haa-d3-blender/coherence.wav -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart /tmp/haa-d3-blender/blender-preview.mp4
          ffprobe -v error -count_frames -show_entries stream=codec_type,codec_name,width,height,nb_read_frames,duration,r_frame_rate:format=duration -of json /tmp/haa-d3-blender/blender-preview.mp4 > /tmp/haa-d3-blender/mp4-probe.json
          ffmpeg -v error -xerror -i /tmp/haa-d3-blender/blender-preview.mp4 -f null -
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path
          root = Path("/tmp/haa-d3-blender")
          manifest_path = root / "render-manifest.json"
          manifest = json.loads(manifest_path.read_text())
          probe = json.loads((root / "mp4-probe.json").read_text())
          streams = probe["streams"]
          video = next(s for s in streams if s["codec_type"] == "video")
          audio = next(s for s in streams if s["codec_type"] == "audio")
          assert video["codec_name"] == "h264" and audio["codec_name"] == "aac"
          assert int(video["width"]) == 1920 and int(video["height"]) == 1080
          assert int(video["nb_read_frames"]) == manifest["frame_count"], (video, manifest["frame_count"])
          video_duration = float(video["duration"])
          audio_duration = float(audio["duration"])
          delta = abs(video_duration - audio_duration)
          print("MP4_STREAMS", json.dumps({"video":video,"audio":audio}, indent=2))
          assert math.isfinite(delta) and delta <= 0.1, (video_duration, audio_duration, delta)
          for name in ("coherence.wav", "blender-preview.mp4"):
              path = root / name
              assert path.is_file() and path.stat().st_size > 1000
              manifest["artifact_inventory"][name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              }
          manifest["video_preview"] = {
              "file": "blender-preview.mp4",
              "video_codec": video["codec_name"],
              "audio_codec": audio["codec_name"],
              "frame_count": int(video["nb_read_frames"]),
              "video_duration_seconds": video_duration,
              "audio_duration_seconds": audio_duration,
              "audio_video_duration_delta_seconds": round(delta, 6),
              "audio_interpretation": "algorithmic order-parameter data sonification; not a composed soundtrack",
              "evidence_class": "MODEL_OUTPUT",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          (root / "mp4-probe.json").unlink()
          print(json.dumps(manifest["video_preview"], indent=2))
          PY
      - name: Verify Blender render and editable project
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          root = Path("/tmp/haa-d3-blender")
          manifest = json.loads((root / "render-manifest.json").read_text())
          expected = manifest["frame_end"] - manifest["frame_start"] + 1
          frames = sorted(root.glob("frame_*.png"))
          assert manifest["status"] == "RENDERED_NOT_REVIEWED"
          assert manifest["frame_count"] == expected == len(frames), (manifest, len(frames))
          assert manifest["effective_fps"] > 0
          assert manifest["unowned_objects_preserved"] == 3
          assert (root / "scene.blend").is_file() and (root / "scene.blend").stat().st_size > 1000
          assert set(manifest["artifact_inventory"]) == {"scene.blend", "coherence.wav", "blender-preview.mp4", *(p.name for p in frames)}
          assert manifest["video_preview"]["video_codec"] == "h264"
          assert manifest["video_preview"]["audio_codec"] == "aac"
          assert manifest["video_preview"]["frame_count"] == len(frames)
          assert manifest["video_preview"]["audio_video_duration_delta_seconds"] <= 0.1
          for frame in frames:
              data = frame.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (1920, 1080)
              assert len(data) > 1000
          for name, item in manifest["artifact_inventory"].items():
              path = root / name
              import hashlib
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          print(json.dumps({"blender_version":manifest["blender_version"],"frames":len(frames),"resolution":manifest["resolution"],"engine":manifest["render_engine"]}, indent=2))
          PY
      - name: Reopen saved Blender project
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background /tmp/haa-d3-blender/scene.blend --python-expr "import bpy; assert bpy.context.scene.camera.name == 'Camera'; assert bpy.data.objects.get('Cube') is not None; assert bpy.data.objects['Cube'].hide_render is False; assert bpy.data.objects.get('HAA-D3-Camera') is not None; assert sum(1 for obj in bpy.data.objects if obj.get('haa_d3_generated') is True) >= 10; print('BLEND_REOPEN_PASS', bpy.app.version_string)"
      - name: Upload Blender render evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: haa-d3-blender-runtime-evidence
          path: /tmp/haa-d3-blender/
          retention-days: 14

  manim-runtime:
    needs: python-core
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev ffmpeg
      - name: Install HAA-D-3 and Manim Community
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
          python -m pip install -e .
          python -m pip install "manim==0.19.0"
          manim --version
      - name: Generate canonical SceneSpec fixture
        run: |
          PYTHONPATH=src python -m haa_d3.cli kuramoto-scene --nodes 8 --steps 10 --dt 0.1 --frame-rate 10 --seed 17 --output /tmp/haa-d3-manim-scene.json
          PYTHONPATH=src python -m haa_d3.cli validate-scene /tmp/haa-d3-manim-scene.json
      - name: Render SceneSpec through Manim adapter
        run: |
          HAA_D3_SCENE_FILE=/tmp/haa-d3-manim-scene.json manim -ql --disable_caching --media_dir /tmp/haa-d3-manim -o haa-d3-manim-preview.mp4 adapters/manim/render_scene.py HaaD3SceneSpecSmoke
          VIDEO="$(find /tmp/haa-d3-manim -type f -name '*.mp4' -size +1k -print -quit)"
          test -n "$VIDEO"
      - name: Decode and record Manim preview
        run: |
          VIDEO="$(find /tmp/haa-d3-manim -type f -name '*.mp4' -size +1k -print -quit)"
          ffmpeg -v error -xerror -i "$VIDEO" -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames,duration -of json "$VIDEO" > /tmp/haa-d3-manim-probe.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/haa-d3-manim')
          video = next(root.rglob('*.mp4'))
          probe = json.loads(Path('/tmp/haa-d3-manim-probe.json').read_text())
          stream = next(s for s in probe['streams'] if s.get('codec_name') == 'h264')
          assert int(stream['width']) >= 640 and int(stream['height']) >= 360
          assert video.stat().st_size > 1000
          receipt = {'status':'RENDERED_NOT_REVIEWED','renderer':'Manim Community','renderer_version':'0.19.0','scene_spec':'/tmp/haa-d3-manim-scene.json','video':video.name,'sha256':hashlib.sha256(video.read_bytes()).hexdigest(),'size_bytes':video.stat().st_size,'stream':stream,'evidence_class':'MODEL_OUTPUT','limitations':['Smoke render only; not a human-approved cinematic master.']}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Upload Manim runtime evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: haa-d3-manim-runtime-evidence
          path: /tmp/haa-d3-manim/
          retention-days: 14
