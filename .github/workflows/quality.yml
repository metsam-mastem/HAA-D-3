name: HAA-D-3 Quality Gate
on:
  push:
    branches: [main, "work/**", "feat/**", "fix/**", "docs/**", "research/**", "creative/**", "foundation/**", "release/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Choose the smallest validation scope needed"
        required: true
        default: full
        type: choice
        options:
          - full
          - docs
          - python
permissions:
  contents: read
jobs:
  repository-governance:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Enforce single-source repository structure
        run: python scripts/check_repository_structure.py
      - name: Check tracked Markdown inventory
        run: python scripts/check_document_catalog.py
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
  python-core:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install patched build tooling
        run: python -m pip install --upgrade "setuptools>=84.1.0"
      - name: Install package and media dependencies
        run: python -m pip install -e ".[media]"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable
          pip-audit --skip-editable --format cyclonedx-json --output /tmp/haa-d3-sbom.json
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: haa-d3-python-sbom
          path: /tmp/haa-d3-sbom.json
          retention-days: 30
      - name: Run complete Python test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate example SceneSpec
        run: PYTHONPATH=src python -m haa_d3.cli validate-scene examples/scenes/synthetic-emergence.scene.json
      - name: Generate and validate Kuramoto SceneSpec
        run: |
          PYTHONPATH=src python -m haa_d3.cli kuramoto-scene --nodes 12 --steps 5 --seed 11 --output /tmp/kuramoto-scene.json
          PYTHONPATH=src python -m haa_d3.cli validate-scene /tmp/kuramoto-scene.json
      - name: Build end-to-end release bundle
        run: |
          PYTHONPATH=src python -m haa_d3.cli build-release --nodes 8 --steps 4 --dt 0.1 --frame-rate 5 --video --output /tmp/haa-d3-release.zip
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/haa-d3-release.zip'); assert 'manifest.json' in z.namelist(); assert 'frames/000000.svg' in z.namelist(); assert 'sonification/coherence.mid' in z.namelist(); assert 'sonification/coherence.wav' in z.namelist(); assert 'video/preview.mp4' in z.namelist()"
      - name: Upload generated vertical-slice release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: haa-d3-e2e-release
          path: /tmp/haa-d3-release.zip
          retention-days: 14
      - name: Generate knowledge graph, SVG and provenance receipt
        run: PYTHONPATH=src python -m haa_d3.cli render-knowledge-graph examples/knowledge/seed-graph.json --out /tmp/knowledge-graph
      - name: Verify generated graph artifacts
        run: |
          test -s /tmp/knowledge-graph/graph.json
          test -s /tmp/knowledge-graph/graph.svg
          test -s /tmp/knowledge-graph/receipt.json

  blender-runtime:
    needs: python-core
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb xauth libgl1-mesa-dri
          blender --version
      - name: Install HAA-D-3 core
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
          python -m pip install -e .
      - name: Generate representative SceneSpec
        run: |
          PYTHONPATH=src python -m haa_d3.cli kuramoto-scene --nodes 8 --steps 10 --dt 0.1 --frame-rate 10 --seed 17 --output /tmp/haa-d3-blender-scene.json
      - name: Execute Blender background render
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --factory-startup --python adapters/blender/render_scene.py -- --scene /tmp/haa-d3-blender-scene.json --output /tmp/haa-d3-blender
      - name: Verify Blender render and editable project
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          root = Path("/tmp/haa-d3-blender")
          manifest = json.loads((root / "render-manifest.json").read_text())
          expected = manifest["frame_end"] - manifest["frame_start"] + 1
          frames = sorted(root.glob("frame_*.png"))
          assert manifest["status"] == "RENDERED_NOT_REVIEWED"
          assert manifest["frame_count"] == expected == len(frames), (manifest, len(frames))
          assert manifest["effective_fps"] > 0
          assert (root / "scene.blend").is_file() and (root / "scene.blend").stat().st_size > 1000
          assert set(manifest["artifact_inventory"]) == {"scene.blend", *(p.name for p in frames)}
          for frame in frames:
              data = frame.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (1920, 1080)
              assert len(data) > 1000
          for name, item in manifest["artifact_inventory"].items():
              path = root / name
              import hashlib
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          print(json.dumps({"blender_version":manifest["blender_version"],"frames":len(frames),"resolution":manifest["resolution"],"engine":manifest["render_engine"]}, indent=2))
          PY
      - name: Reopen saved Blender project
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background /tmp/haa-d3-blender/scene.blend --python-expr "import bpy; assert bpy.context.scene.camera is not None; assert sum(1 for obj in bpy.data.objects if obj.get('haa_d3_generated') is True) >= 10; print('BLEND_REOPEN_PASS', bpy.app.version_string)"
      - name: Upload Blender render evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: haa-d3-blender-runtime-evidence
          path: /tmp/haa-d3-blender/
          retention-days: 14
