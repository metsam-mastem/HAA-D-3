name: HAA-D-3 Quality Gate
on:
  push:
    branches: [main, "work/**", "feat/**", "fix/**", "docs/**", "research/**", "creative/**", "foundation/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce single-source repository structure
        run: python scripts/check_repository_structure.py
      - name: Check tracked Markdown inventory
        run: python scripts/check_document_catalog.py
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and runtime dependencies
        run: python -m pip install -e .
      - name: Run complete Python test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate example SceneSpec
        run: PYTHONPATH=src python -m haa_d3.cli validate-scene examples/scenes/synthetic-emergence.scene.json
      - name: Generate and validate Kuramoto SceneSpec
        run: |
          PYTHONPATH=src python -m haa_d3.cli kuramoto-scene --nodes 12 --steps 5 --seed 11 --output /tmp/kuramoto-scene.json
          PYTHONPATH=src python -m haa_d3.cli validate-scene /tmp/kuramoto-scene.json
      - name: Build end-to-end release bundle
        run: |
          PYTHONPATH=src python -m haa_d3.cli build-release --nodes 8 --steps 4 --dt 0.1 --frame-rate 5 --output /tmp/haa-d3-release.zip
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/haa-d3-release.zip'); assert 'manifest.json' in z.namelist(); assert 'frames/000000.svg' in z.namelist(); assert 'sonification/coherence.mid' in z.namelist()"
      - name: Upload generated vertical-slice release
        uses: actions/upload-artifact@v4
        with:
          name: haa-d3-e2e-release
          path: /tmp/haa-d3-release.zip
          retention-days: 14
      - name: Generate knowledge graph, SVG and provenance receipt
        run: PYTHONPATH=src python -m haa_d3.cli render-knowledge-graph examples/knowledge/seed-graph.json --out /tmp/knowledge-graph
      - name: Verify generated graph artifacts
        run: |
          test -s /tmp/knowledge-graph/graph.json
          test -s /tmp/knowledge-graph/graph.svg
          test -s /tmp/knowledge-graph/receipt.json
